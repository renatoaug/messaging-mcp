name: Feature request
description: Propose something new for Messaging MCP.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what the feature lets an assistant or its owner do.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, with a real example if you have one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work, and who approves what.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety
      description: What could an agent, or a message an agent reads, do with this that the owner did not want? How is that prevented?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true

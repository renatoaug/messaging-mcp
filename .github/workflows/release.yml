name: Release

# Every merge to main is a release: semantic-release reads the Conventional Commit titles since the
# last tag, bumps the version in Cargo.toml and Cargo.lock (feat a minor, everything else a patch),
# writes CHANGELOG.md, commits them with [skip ci], tags vX.Y.Z and publishes the GitHub release.
# Then each supported system builds both binaries (messaging-mcp and its WhatsApp bridge) and
# attaches them to that release.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # releases queue up; none is dropped

permissions:
  contents: read

jobs:
  release:
    name: Version, changelog and tag
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write # the release commit, the tag and the GitHub release
      issues: write # semantic-release comments on the issues a release closes
      pull-requests: write # and on the pull requests it ships
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: the version comes from the commits since the last tag

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # scripts/set-version.sh refreshes Cargo.lock with cargo.
      - run: rustup show active-toolchain || rustup toolchain install

      # The preset stays on 9.x: 10.x needs conventional-changelog-writer 9, and semantic-release
      # 25's release notes generator still ships writer 8.
      - id: semantic
        run: >
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: Binary for ${{ matrix.target }}
    needs: release
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # uploads to the release
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, goos: darwin, goarch: arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, goos: darwin, goarch: amd64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, goos: linux, goarch: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, goos: linux, goarch: arm64 }
    env:
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum # the module is not at the root

      # Pure Go (the SQLite driver needs no C), so it cross-builds for every target.
      - name: Build the WhatsApp bridge
        working-directory: whatsapp-bridge
        run: go build -trimpath -o "../target/${{ matrix.target }}/release/messaging-mcp-whatsapp-bridge" .
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Package and upload
        run: |
          name="messaging-mcp-${TAG}-${{ matrix.target }}"
          tar -czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" messaging-mcp messaging-mcp-whatsapp-bridge
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

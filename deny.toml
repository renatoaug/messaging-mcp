# cargo-deny: known vulnerabilities, licenses we accept, and where crates may come from.
# This binary holds personal account sessions, so a new advisory fails the build.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained, with no replacement yet. The official MCP SDK (rmcp) and schemars
    # require it; it is not a vulnerability. Remove once they drop it.
    { id = "RUSTSEC-2026-0543", reason = "required by rmcp and schemars; unmaintained, not vulnerable" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

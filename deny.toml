# cargo-deny: known vulnerabilities, licenses we accept, and where crates may come from.
# This binary holds personal account sessions, so a new advisory fails the build.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
